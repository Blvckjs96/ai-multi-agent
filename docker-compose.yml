
# Backend development configuration
# Usage: docker-compose up -d
#
# ARGO DEV WORKFLOW NOTE:
# The 'app' service (Docker backend) is NOT used in the argo-dev workflow.
# Argo spawns the claude CLI via subprocess — that macOS binary cannot run
# inside a Linux Docker container, so FastAPI must run on the host.
# Use 'make argo-dev' which runs infra in Docker + FastAPI locally.
# The 'app' service is in the 'full' profile — start it only for non-Argo testing:
#   docker compose --profile full up -d

services:
  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ai_multi_agent_backend:dev
    container_name: ai_multi_agent_backend
    profiles: ["full"]
    ports:
      - "8007:8000"
    volumes:
      - media_data:/app/media
    env_file:
      - ./backend/.env
    environment:
      - DEBUG=true
      - ENVIRONMENT=local
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - REDIS_HOST=redis
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - PYTHONDONTWRITEBYTECODE=1
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - backend
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: pgvector/pgvector:pg16
    container_name: ai_multi_agent_db
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-ai_multi_agent}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Port 5434: avoids conflict with EDB PostgreSQL (5432) and Homebrew PostgreSQL (5433)
    ports:
      - "5434:5432"
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Give PostgreSQL time to flush WAL and shutdown cleanly before Docker sends SIGKILL.
    # Without this, every restart triggers WAL recovery ("not properly shut down").
    stop_grace_period: 30s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: ai_multi_agent_redis
    # Port exposed only for local development - remove in production
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  celery_worker:
    image: ai_multi_agent_backend:dev
    container_name: ai_multi_agent_celery_worker
    volumes:
      - media_data:/app/media
    # -E enables Celery events so Flower can display worker stats and task history
    command: celery -A app.worker.celery_app worker --loglevel=info -E
    env_file:
      - ./backend/.env
    environment:
      - DEBUG=true
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - REDIS_HOST=redis
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - PYTHONDONTWRITEBYTECODE=1
    healthcheck:
      # pgrep is reliable regardless of worker hostname; inspect ping -d requires exact hostname match
      test: ["CMD-SHELL", "celery -A app.worker.celery_app inspect ping --timeout 5 2>/dev/null | grep -q 'pong' || pgrep -f 'celery.*worker' > /dev/null"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 30s
    networks:
      - backend
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    restart: unless-stopped

  celery_beat:
    image: ai_multi_agent_backend:dev
    container_name: ai_multi_agent_celery_beat
    command: celery -A app.worker.celery_app beat --loglevel=info
    env_file:
      - ./backend/.env
    environment:
      - DEBUG=true
      - REDIS_HOST=redis
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - PYTHONDONTWRITEBYTECODE=1
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'celery.*beat' > /dev/null"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - backend
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  flower:
    image: ai_multi_agent_backend:dev
    container_name: ai_multi_agent_flower
    command: celery -A app.worker.celery_app flower --port=5555
    ports:
      - "5555:5555"
    env_file:
      - ./backend/.env
    environment:
      - DEBUG=true
      - REDIS_HOST=redis
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:5555/healthcheck')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - backend
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

networks:
  backend:
    driver: bridge

volumes:
  media_data:
  postgres_data:
  redis_data:

[package]
name = "argo"
version = "0.1.0"
description = "Argo — AI workspace desktop app"
authors = ["Blvckjs96"]
edition = "2021"

[lib]
name = "argo_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "argo"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.8"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
